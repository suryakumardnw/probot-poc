name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks reads pull request metadata when scanning a PR.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Quality metrics
        run: npm run metrics:quality

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reviewer
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      # Cheapest tiers first: unit and contract need no migrated database, so
      # a logic or contract failure fails the job before the infrastructure
      # tiers spend time on migrations and review fixtures. Logs are tee'd so
      # the failure artifact below includes the full Vitest output.
      - name: Unit tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:unit 2>&1 | tee test-results/unit.log
      - name: Contract tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:contract 2>&1 | tee test-results/contract.log
      - name: Apply database migrations
        run: npx prisma migrate deploy
      # The infrastructure tiers share one Postgres/Redis instance and run
      # with a single worker each; keep them in separate steps so a failure
      # names the tier.
      - name: Integration tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:integration 2>&1 | tee test-results/integration.log
      - name: Characterization tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:characterization 2>&1 | tee test-results/characterization.log
      - name: Build
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run build 2>&1 | tee test-results/build.log
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-results/
          if-no-files-found: ignore

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint
      - name: Validate branch commits
        run: >-
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        # Fails on any high/critical advisory that is not explicitly allowlisted.
        # The four known pre-existing advisories and their follow-ups live in
        # scripts/npm-audit-allowlist.json and docs/security-audit-follow-ups.md.
        run: npm run security:audit
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
